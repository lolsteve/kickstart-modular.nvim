# Check Lua Formatting
name: Check Lua Formatting
on:
  push:
    branches:
      - master
  pull_request:
    # Ignore fork-sync PRs (they come from master and merge within seconds,
    # before the pull_request run can start — leaving startup-failure noise)
    branches-ignore:
      - master

jobs:
  stylua-check:
    if: github.repository == 'nvim-lua/kickstart.nvim'
    name: Stylua Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Stylua Check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .
